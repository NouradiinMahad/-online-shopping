<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | Carfoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=11">
    <script>
        if (!localStorage.getItem('isLoggedIn') || !localStorage.getItem('currentUser')) {
            window.location.href = '../index.html';
        }
    </script>
</head>
<body class="dark-mode"> <!-- Starting with default dark mode -->
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar glass" id="dashboard-sidebar" style="position: fixed; height: 100vh; overflow-y: auto;">
            <span class="close-sidebar-btn" id="close-sidebar-btn" style="position:absolute; top:1.5rem; right:1.5rem; font-size:2rem; cursor:pointer; color:var(--text-color); display:none;">&times;</span>
            <div class="sidebar-logo">
                CARFOON.<br>
                <span style="font-size: 0.8rem; color: var(--accent-color); font-weight: 400; letter-spacing: 0;" data-i18n="admin_dashboard">CUSTOMER DASHBOARD</span>
            </div>
            <button class="tab-btn active" id="tab-orders" data-i18n="user_orders">My Orders</button>
            <button class="tab-btn" id="tab-settings" data-i18n="admin_settings">Settings</button>
            
            <div style="margin-top: auto;">
                <select class="lang-switcher" style="width:100%; background: transparent; color: var(--text-color); border: 1px solid var(--glass-border); border-radius: 4px; padding: 8px; margin-bottom: 1rem; cursor: pointer;">
                    <option value="en">English (EN)</option>
                    <option value="so">Somali (SO)</option>
                    <option value="ar">Arabic (AR)</option>
                </select>
                <button onclick="window.location.href='../index.html'" class="tab-btn" style="width: 100%; border: 1px solid var(--glass-border); text-align: center; margin-bottom: 1rem;" data-i18n="user_go_store">Go to Store</button>
                <button id="logout-btn" class="tab-btn" style="width: 100%; border: 1px solid var(--accent-color); text-align: center; color: var(--accent-color);" data-i18n="logout">Logout</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="admin-main">
            <!-- Mobile Sidebar Toggle -->
            <button class="mobile-sidebar-toggle" id="mobile-sidebar-toggle">☰ Menu</button>
            <header class="admin-header">
                <div>
                    <h2 style="font-size: 2rem; font-weight: 800;" id="page-title" data-i18n="user_history">Order History</h2>
                    <div style="opacity: 0.8;"><span data-i18n="welcome_back">Welcome back</span>, <span id="display-user-email"></span></div>
                </div>
                <div>
                    <button class="theme-toggle" title="Toggle Theme" style="padding: 8px 16px; font-size: 1.2rem; cursor: pointer; border-radius: 8px;">☀️</button>
                </div>
            </header>

            <!-- Orders Section -->
            <section id="section-orders">
                <div class="glass" style="padding: 2rem; border-radius: 16px;">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem;" data-i18n="user_recent">Your Recent Purchases</h3>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left;">
                            <thead>
                                <tr style="border-bottom: 1px solid var(--glass-border);">
                                    <th style="padding: 1rem; padding-left: 0;" data-i18n="col_order_id">Order ID</th>
                                    <th style="padding: 1rem;" data-i18n="col_amount">Total Amount</th>
                                    <th style="padding: 1rem;" data-i18n="col_address">Shipping Address</th>
                                    <th style="padding: 1rem;">Payment Info</th>
                                    <th style="padding: 1rem;" data-i18n="col_status">Status</th>
                                    <th style="padding: 1rem;" data-i18n="col_date">Date</th>
                                </tr>
                            </thead>
                            <tbody id="user-orders-body">
                                <tr><td colspan="5" style="text-align:center; padding: 2rem; opacity: 0.7;">Loading orders...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Settings & Profile Section -->
            <section id="section-settings" style="display: none; max-width: 600px;">
                <div class="glass" style="padding: 2.5rem; border-radius: 16px;">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem;" data-i18n="settings_title">Profile Management</h3>
                    <form id="profile-update-form">
                        <div class="form-group">
                            <label data-i18n="settings_current_email">Current Email (Required)</label>
                            <input type="email" id="update-current-email" required readonly class="readonly-input" style="opacity: 0.7;">
                        </div>
                        <div class="form-group">
                            <label data-i18n="settings_new_email">New Email Address (Optional)</label>
                            <input type="email" id="update-new-email" placeholder="new.email@example.com">
                        </div>
                        <div class="form-group">
                            <label data-i18n="settings_new_password">New Password (Optional)</label>
                            <input type="password" id="update-new-password" placeholder="Leave blank to keep current password">
                        </div>
                        <p id="profile-status" style="font-size: 0.95rem; margin-top: 1rem; margin-bottom: 1rem; min-height: 20px;"></p>
                        <button type="submit" class="submit-btn" id="submit-profile-btn" data-i18n="settings_save">Save Changes</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- We will use the same theme toggle logic if needed, but it's isolated here to keep it light -->
    <script src="../translations.js?v=7"></script>
    <script src="dashboard.js?v=2"></script>
</body>
</html>
